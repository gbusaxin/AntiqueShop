name: UI quality (visual regression + Lighthouse)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate visual baselines (download the artifact and commit tests/__screenshots__)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    # Secrets are not available to PRs from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://vintageempire.com
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

      - name: Assemble standalone bundle (static assets + public)
        run: npm run prepare:standalone

      - uses: actions/upload-artifact@v7
        with:
          name: next-standalone
          path: .next/standalone
          include-hidden-files: true
          retention-days: 1

  visual:
    name: Visual regression (Playwright)
    needs: build
    runs-on: ubuntu-latest
    # Pinned image = identical browser build and system fonts → stable screenshots
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: next-standalone
          path: .next/standalone

      - name: Run visual tests
        run: npx playwright test --project=visual-desktop --project=visual-mobile ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: 'true'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Upload new baselines
        if: inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/__screenshots__
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: next-standalone
          path: .next/standalone

      # Pin the version once you have run it (npm view @lhci/cli version)
      - name: Lighthouse CI
        run: npx --yes @lhci/cli autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
