name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  grep-secrets:
    name: Grep Hardcoded Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search for hardcoded secrets in src/
        run: |
          FOUND=0

          echo "=== Checking for sk_live_ ==="
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'sk_live_' src/; then
            echo "FAIL: Stripe live key found in source"
            FOUND=1
          fi

          echo "=== Checking for service_role in NEXT_PUBLIC_ ==="
          if grep -r --include="*.ts" --include="*.tsx" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'NEXT_PUBLIC_.*SERVICE_ROLE\|NEXT_PUBLIC_.*service_role' src/; then
            echo "FAIL: service_role in NEXT_PUBLIC variable"
            FOUND=1
          fi

          echo "=== Checking for AIza (Google API keys) ==="
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'AIza[0-9A-Za-z_-]{35}' src/; then
            echo "FAIL: Google API key found"
            FOUND=1
          fi

          if [ "$FOUND" = "1" ]; then
            exit 1
          fi
          echo "No hardcoded secrets found ✓"

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (custom + OWASP)
        run: |
          semgrep \
            --config=.semgrep.yml \
            --config=p/owasp-top-ten \
            --config=p/react \
            --config=p/typescript \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            src/
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  lint:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (with security plugins)
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [audit, secrets, grep-secrets, sast, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://belle-epoque.com
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

  gate:
    name: Security Gate — PASS
    runs-on: ubuntu-latest
    needs: [audit, secrets, grep-secrets, sast, lint, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          FAILED=0
          RESULTS='${{ toJSON(needs) }}'

          echo "$RESULTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = []
          for job, info in data.items():
              result = info.get('result', 'unknown')
              status = '✅' if result == 'success' else '❌'
              print(f'{status} {job}: {result}')
              if result != 'success':
                  failed.append(job)
          if failed:
              print(f'\nSECURITY GATE BLOCKED: {failed}')
              sys.exit(1)
          else:
              print('\n✅ All security checks passed — deploy allowed')
          "
