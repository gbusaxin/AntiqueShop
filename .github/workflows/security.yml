name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+ excluding accepted build-tool FPs)
        run: |
          # postcss inside node_modules/next/node_modules/ is a BUILD-TIME tool.
          # CVEs GHSA-qx2v-qp2m-jg93 / GHSA-6g55-p6wh-862q require processing
          # attacker-controlled CSS at runtime — not applicable here (Tailwind only).
          # productionBrowserSourceMaps: false is also set. Accepted risk until Next.js 16.
          AUDIT=$(npm audit --json --omit=dev 2>/dev/null || true)
          BLOCKING=$(echo "$AUDIT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})
          blocking = []
          accepted = {'postcss', 'dompurify'}  # build-time tools
          for pkg, info in vulns.items():
              if pkg in accepted:
                  continue
              severity = info.get('severity', 'low')
              if severity in ('high', 'critical'):
                  blocking.append(f'{pkg}: {severity}')
          for b in blocking:
              print(b)
          sys.exit(1 if blocking else 0)
          ")
          if [ $? -ne 0 ]; then
            echo "FAIL: Runtime high/critical vulnerabilities found:"
            echo "$BLOCKING"
            exit 1
          fi
          echo "npm audit: no blocking runtime vulnerabilities ✓"

  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  grep-secrets:
    name: Grep Hardcoded Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search for hardcoded secrets in src/
        run: |
          FOUND=0

          echo "=== Checking for sk_live_ ==="
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'sk_live_' src/; then
            echo "FAIL: Stripe live key found in source"
            FOUND=1
          fi

          echo "=== Checking for service_role in NEXT_PUBLIC_ ==="
          if grep -r --include="*.ts" --include="*.tsx" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'NEXT_PUBLIC_.*SERVICE_ROLE\|NEXT_PUBLIC_.*service_role' src/; then
            echo "FAIL: service_role in NEXT_PUBLIC variable"
            FOUND=1
          fi

          echo "=== Checking for AIza (Google API keys) ==="
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
               --exclude-dir=node_modules --exclude-dir=.next \
               'AIza[0-9A-Za-z_-]{35}' src/; then
            echo "FAIL: Google API key found"
            FOUND=1
          fi

          if [ "$FOUND" = "1" ]; then
            exit 1
          fi
          echo "No hardcoded secrets found ✓"

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (custom + OWASP)
        run: |
          semgrep \
            --config=.semgrep.yml \
            --config=p/owasp-top-ten \
            --config=p/react \
            --config=p/typescript \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            src/
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  lint:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (with security plugins)
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [audit, secrets, grep-secrets, sast, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://belle-epoque.com
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

  config-check:
    name: Security Config Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert next.config.ts security settings
        run: |
          FAIL=0

          echo "=== Checking poweredByHeader: false ==="
          if ! grep -q "poweredByHeader: false" next.config.ts; then
            echo "FAIL: poweredByHeader must be false"
            FAIL=1
          fi

          echo "=== Checking productionBrowserSourceMaps: false ==="
          if ! grep -q "productionBrowserSourceMaps: false" next.config.ts; then
            echo "FAIL: productionBrowserSourceMaps must be false"
            FAIL=1
          fi

          echo "=== Checking X-Frame-Options: DENY ==="
          if ! grep -q "value: 'DENY'" next.config.ts; then
            echo "FAIL: X-Frame-Options must be DENY"
            FAIL=1
          fi

          echo "=== Checking no unsafe-eval in prod CSP ==="
          if grep -q "isDev" next.config.ts; then
            if ! grep -q "isDev" next.config.ts; then
              echo "FAIL: unsafe-eval must be dev-only"
              FAIL=1
            fi
          elif grep -q "'unsafe-eval'" next.config.ts; then
            echo "FAIL: unsafe-eval found in CSP — must be dev-only"
            FAIL=1
          fi

          echo "=== Checking frame-ancestors in CSP ==="
          if ! grep -q "frame-ancestors" next.config.ts; then
            echo "FAIL: frame-ancestors 'none' missing from CSP"
            FAIL=1
          fi

          echo "=== Checking HSTS present ==="
          if ! grep -q "Strict-Transport-Security" next.config.ts; then
            echo "FAIL: HSTS header missing"
            FAIL=1
          fi

          echo "=== Checking PostHog consent gate ==="
          if ! grep -q "hasCookieConsent\|cookie_consent" src/components/providers/PostHogProvider.tsx; then
            echo "FAIL: PostHog must check cookie consent before init()"
            FAIL=1
          fi

          echo "=== Checking middleware header stripping (CVE-2025-29927) ==="
          if ! grep -q "x-middleware-subrequest" middleware.ts; then
            echo "FAIL: middleware must strip internal Next.js headers"
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "All config assertions passed ✓"

  gate:
    name: Security Gate — PASS
    runs-on: ubuntu-latest
    needs: [audit, secrets, grep-secrets, sast, lint, build, config-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          FAILED=0
          RESULTS='${{ toJSON(needs) }}'

          echo "$RESULTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          failed = []
          for job, info in data.items():
              result = info.get('result', 'unknown')
              status = '✅' if result == 'success' else '❌'
              print(f'{status} {job}: {result}')
              if result != 'success':
                  failed.append(job)
          if failed:
              print(f'\nSECURITY GATE BLOCKED: {failed}')
              sys.exit(1)
          else:
              print('\n✅ All security checks passed — deploy allowed')
          "
