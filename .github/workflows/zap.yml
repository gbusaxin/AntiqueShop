name: OWASP ZAP DAST Scan

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: Target URL to scan (e.g. Vercel preview URL)
        required: true
        default: https://antique-shop-preview.vercel.app

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ github.event.deployment_status.target_url }}" >> $GITHUB_OUTPUT
          fi

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: .zap/rules.tsv
          cmd_options: >
            -a
            -j
            -I
          artifact_name: zap-report
          allow_issue_writing: true
          issue_title: ZAP DAST Scan Report — ${{ github.sha }}

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: report_html.html
          retention-days: 30

      - name: Fail on High Alerts
        if: always()
        run: |
          if [ -f report_json.json ]; then
            HIGH=$(python3 -c "
          import json
          data = json.load(open('report_json.json'))
          high = sum(1 for site in data.get('site',[]) for alert in site.get('alerts',[]) if alert.get('riskcode') in ['3','4'])
          print(high)
          ")
            echo "High/Critical ZAP alerts: $HIGH"
            if [ "$HIGH" -gt "0" ]; then
              echo "FAIL: $HIGH high/critical vulnerabilities found"
              exit 1
            fi
          fi
