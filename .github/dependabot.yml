version: 2
updates:
  # One pull request a month with every minor/patch update, instead of a branch per package.
  # Security fixes don't wait for this schedule: Dependabot security updates open on their own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 3
    versioning-strategy: lockfile-only
    labels:
      - dependencies
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Bratislava
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
